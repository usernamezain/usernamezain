# Save this file as: .github/workflows/snake.yml
# in your USERNAME/USERNAME profile repo.
#
# One-time setup after adding this file:
#   1. Go to Settings -> Actions -> General -> Workflow permissions
#      -> select "Read and write permissions" -> Save.
#      (Without this, the action can build the SVG but can't push it.)
#   2. Go to the "Actions" tab -> select "Generate Snake Animation"
#      in the left sidebar -> click "Run workflow" once manually.
#      This creates the `output` branch and the SVG immediately,
#      instead of waiting for the first scheduled run.
#   3. In your README, point the <img> at the `output` branch:
#      https://raw.githubusercontent.com/USERNAME/USERNAME/output/github-contribution-grid-snake.svg
#      (replace USERNAME with your actual GitHub username)
#
# After that it regenerates automatically every 24h via the schedule below.

name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *" # runs once a day
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main # regenerate whenever you push to main (optional, safe to remove)

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push snake SVG to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
